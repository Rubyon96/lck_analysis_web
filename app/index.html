<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCK Standings Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="home-page" class="home-page" aria-label="LCK 팀 순위">
        <div class="home-carousel" aria-label="첫 화면 페이지">
          <div class="home-slide-viewport">
            <div id="home-slide-track" class="home-slide-track">
              <article class="home-slide blank" aria-label="왼쪽 예비 페이지"></article>
              <article class="home-slide standings-slide" aria-label="순위 페이지">
                <header class="page-header">
                  <div>
                    <p class="eyebrow">2026 LCK Prototype</p>
                    <h1>STANDINGS</h1>
                  </div>
                  <div class="status-pill">임시 데이터</div>
                </header>

                <nav id="round-tabs" class="round-tabs" aria-label="정규시즌 라운드"></nav>
                <p id="round-note" class="round-note"></p>
                <div id="standings-view" class="standings-view" aria-label="선택 라운드 순위"></div>
                <section id="home-match-preview" class="home-match-preview" aria-label="선택 라운드 경기 정보"></section>
              </article>
              <article id="match-story-slide" class="home-slide story-slide" aria-label="오늘 경기 관전포인트"></article>
            </div>
          </div>
        </div>
      </section>

      <section id="team-detail" class="detail-page" aria-live="polite"></section>
    </main>

    <script src="./data/sample_matches.js"></script>
    <script src="./data/lck_2026_data.js"></script>
    <script src="./data/league_rules.js"></script>
    <script src="./analysis.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
